<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
    <style>
        body {
            background-color: #ffffff;
            font-family: "Eater", serif;
        }

        table {
            border: 1px solid #800080;
            font-family: "Lavishly Yours", cursive;
            border-collapse: collapse;
            width: 60%;
            margin: auto;
        }
        th {
            border: 1px solid #800080;
            padding-top: 12px;
            padding-bottom: 10px;
            background-color: #198f19;
        }
        td{
            border: 1px solid #800080;
            padding: 13px;
        }
        .bod {
            text-align: center;
            color: #83834d;
        }
    </style>
</head>

<body>
    <table>
        <thead>
            <tr>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Email</th>
                <th>DOB</th>
                <th>Gender</th>
            </tr>

        </thead>
        <tbody>
            <tr>
                <td>Jane</td>
                <td>Doe</td>
                <td>Jane.Doe@example.com</td>
                <td class="bod">1990-01-01</td>
                <td>Female</td>
            </tr>
            <tr>
                <td>John</td>
                <td>Smith</td>
                <td>johnsmith@example.com</td>
                <td class="bod">1985-05-15</td>
                <td>Male</td>
            </tr>
            <tr>
                <td>Emily</td>
                <td>Johnson</td>
                <td>emilyjohnson@example.com</td>
                <td class="bod">1992-08-20</td>
                <td>Female</td>
            </tr>
            <tr>
                <td>Michael</td>
                <td>Brown</td>
                <td>michaelbrown@example.com</td>
                <td class="bod">1988-12-10</td>
                <td>Male</td>
            </tr>
            <tr>
                <td>Sarah</td>
                <td>Davis</td>
                <td>sarahdavis@example.com</td>
                <td class="bod">1995-03-25</td>
                <td>Female</td>
            </tr>

        </tbody>
    </table>

</body>

</html>
