<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
</head>
<body>
    <!-- unordered list -->
     <ul>
        <li>London</li>
        <li>Nairobi</li>
        <li>Kigali</li>
        <li>New York</li>
        <li>Tokyo</li>
        <li>Paris</li>
     </ul>
     <!-- ordered list type 1, a, A-->
      <ol type="1">
        <li>London</li>
        <li>Nairobi</li>
        <li>Kigali</li>
        <li>New York</li>
        <li>Tokyo</li>
        <li>Paris</li>
        <li>London</li>
        <li>Nairobi</li>
        <li>Kigali</li>
        <li>New York</li>
        <li>Tokyo</li>
        <li>Paris</li>
        <li>London</li>
        <li>Nairobi</li>
        <li>Kigali</li>
      </ol>
</body>
</html>
